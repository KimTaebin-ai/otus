[package]
name = "otus-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
diesel = { version = "2.3.14", default-features = false, features = ["postgres_backend", "chrono", "uuid"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
zip = { version = "6", default-features = false }
unicode-normalization = "0.1"
unicode-general-category = "1"
tokio-util = { version = "0.7", features = ["io"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
