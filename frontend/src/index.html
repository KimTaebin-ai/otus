<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>OTUS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="icon.png" />
    <style>
      /* shown until Angular bootstraps and replaces <app-root>'s content */
      .splash {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #fff;
      }
      .splash i {
        width: 28px;
        height: 28px;
        border: 3px solid #e5f4ef;
        border-top-color: #087f73;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root><div class="splash" role="status" aria-label="불러오는 중"><i></i></div></app-root>
  </body>
</html>
