# clamd for OTUS: the backend streams each uploaded PDF over TCP on the pod's loopback.
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 127.0.0.1
# uploads are at most 20 MiB
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxThreads 4
ScanPDF yes
HeuristicAlerts yes
# reload signatures in place: halves peak memory, scans pause briefly during a reload
ConcurrentDatabaseReload no
SelfCheck 3600
