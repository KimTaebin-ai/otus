# Copy to deploy/secrets.yaml (gitignored), fill in, then create the Podman secrets:
#   make secrets        (or: podman kube play --replace deploy/secrets.yaml)
# `make demo` generates this file with random values.
#   passwords: openssl rand -hex 24      keys: openssl rand -base64 32
# Two secrets so each container only gets what it needs.

# Mounted only into the db container.
apiVersion: v1
kind: Secret
metadata:
  name: otus-db
type: Opaque
stringData:
  # the `postgres` superuser, used only by the init script
  postgres-password: CHANGE_ME_DB_SUPERUSER_PASSWORD
  # the app's role `otus` (not a superuser)
  app-password: CHANGE_ME_DB_APP_PASSWORD
---
# Mounted only into the backend container.
apiVersion: v1
kind: Secret
metadata:
  name: otus-backend
type: Opaque
stringData:
  # same password as app-password above; postgres listens on the pod's localhost only
  database-url: postgres://otus:CHANGE_ME_DB_APP_PASSWORD@127.0.0.1:5432/otus
  # AES-256-GCM keys. Back them up apart from the database: without them the encrypted
  # account numbers and stored PDFs can't be read.
  bank-account-key: CHANGE_ME_BANK_ACCOUNT_KEY
  file-encryption-key: CHANGE_ME_FILE_ENCRYPTION_KEY
  # 42 OAuth app; leave empty to turn 42 login off
  forty-two-client-id: ""
  forty-two-client-secret: ""
